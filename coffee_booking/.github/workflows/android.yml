name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare app
        shell: bash
        run: |
          APP_DIR=$(find "$GITHUB_WORKSPACE" -name pubspec.yaml -not -path '*/build/*' -not -path '*/.dart_tool/*' -print -quit)
          APP_DIR=$(dirname "$APP_DIR")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          cd "$APP_DIR"
          flutter create --empty --platforms=android --project-name=coffee_booking .
          flutter pub get
          dart run tool/apply_branding.dart
      - name: Run tests
        run: flutter test
        working-directory: ${{ env.APP_DIR }}
      - name: Build APK
        run: flutter build apk --debug
        working-directory: ${{ env.APP_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: brew-and-go-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
